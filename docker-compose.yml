version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # This creates a 'Media' folder on your PC to store the downloads
      - ./Media:/root/Downloads/StreamForge Media

  swagger:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      - SWAGGER_JSON=/foo/openapi.yaml
    volumes:
      # Connects your local YAML file to the Swagger container
      - ./openapi.yaml:/foo/openapi.yaml